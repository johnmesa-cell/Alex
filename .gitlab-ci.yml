stages:
  - build
  - test
  - deploy

# ── BACKEND (Node.js / Express) ────────────────
build_backend:
  stage: build
  image: node:18-alpine
  script:
    - cd backend
    - npm install
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour

# ── FRONTEND (React + Vite) ────────────────────
build_frontend:
  stage: build
  image: node:18-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# ── TEST BACKEND ───────────────────────────────
test_backend:
  stage: test
  image: node:18-alpine
  script:
    - cd backend
    - npm install
    - npm test
  allow_failure: true

# ── TEST FRONTEND ──────────────────────────────
test_frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm install
    - npm test
  allow_failure: true

# ── DEPLOY ─────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP <<'EOF'
        set -e
        PROJECT_DIR="/home/ubuntu/Alex"

        echo '--- Estado de los contenedores ANTES de los cambios ---'
        sudo docker compose --project-directory $PROJECT_DIR ps

        echo '--- Actualizando código ---'
        cd $PROJECT_DIR
        git fetch origin
        git reset --hard origin/main

        echo '--- Liberando espacio en disco (sin tocar datos) ---'
        sudo docker stop alex_app alex_frontend || true
        sudo docker rm alex_app alex_frontend || true
        sudo docker image rm alex-backend:latest alex-frontend:latest || true
        sudo docker image prune -f
        sudo docker network prune -f

        echo '--- Reconstruyendo contenedores ---'
        sudo docker compose --project-directory $PROJECT_DIR build --no-cache backend frontend
        sudo docker compose --project-directory $PROJECT_DIR up -d

        echo '--- Estado de los contenedores DESPUÉS de los cambios ---'
        sudo docker compose --project-directory $PROJECT_DIR ps
      EOF
  only:
    - main
