services:
  # Requiere .env con POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB definidos
  db:
    image: postgres:15-alpine
    container_name: alex_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alex_net

  chroma:
    image: chromadb/chroma
    container_name: alex_chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index
    networks:
      - alex_net

  backend:
    build:
      context: ./backend/express-ts-openai
      dockerfile: Dockerfile
    container_name: alex_app
    restart: always
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"
    volumes:
      - ./backend/express-ts-openai:/app
      - /app/node_modules
      - ./backend/express-ts-openai/uploads:/app/uploads
      - ./backend/express-ts-openai/temp_voice:/app/temp_voice
    ports:
      - "3002:3000"
    environment:
      - AGENT_URL=http://alex_agent:3500
    env_file:
      - ./backend/express-ts-openai/.env
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - alex_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alex_frontend
    restart: always
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    networks:
      - alex_net

networks:
  alex_net:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
